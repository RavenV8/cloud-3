<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
</head>

<body>

    <h1>Edit Book</h1>

    <form
        action="/edit/{{ book.id }}"
        method="POST"
        enctype="multipart/form-data"
    >

        <div>
            <label for="title">Title:</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ book.title }}"
                required
            >
        </div>

        <br>

        <div>
            <label for="author">Author:</label>
            <input
                type="text"
                id="author"
                name="author"
                value="{{ book.author }}"
                required
            >
        </div>

        <br>

        <div>
            <label for="published_date">Published date:</label>
            <input
                type="date"
                id="published_date"
                name="published_date"
                value="{{ book.published_date }}"
                required
            >
        </div>

        <br>

        <div>
            <label for="pages">Pages:</label>
            <input
                type="number"
                id="pages"
                name="pages"
                value="{{ book.pages }}"
                min="1"
                required
            >
        </div>

        <br>

        <div>
            <label for="author_portrait">New author portrait:</label>
            <input
                type="file"
                id="author_portrait"
                name="author_portrait"
                accept="image/*"
            >
        </div>

        <br>

        {% if book.author_portrait %}
            <div>
                <p>Current portrait:</p>

                <img
                    src="{{ url_for('uploaded_file', filename=book.author_portrait) }}"
                    width="150"
                    alt="Current author portrait"
                >
            </div>

            <br>
        {% endif %}

        <div>
            <label>
                <input
                    type="checkbox"
                    name="available"
                    {% if book.available %}checked{% endif %}
                >
                Available
            </label>
        </div>

        <br>

        <button type="submit">
            Update Book
        </button>

    </form>

    <br>

    <a href="/">
        Back to books
    </a>

</body>
</html>
